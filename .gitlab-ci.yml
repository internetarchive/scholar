    DEBIAN_FRONTEND: noninteractive
    http_proxy: "http://http-proxy.us.archive.org:8080"
    https_proxy: "http://http-proxy.us.archive.org:8080"
    no_proxy: "nexus.us.archive.org,*.archive.org,archive.org"
  rules:
    # run tests when any file in scholkit/ changes (except VERSION file alone)
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - scholkit/**/*
      when: on_success
    # skip if this is a tag build (build job will run instead)
    - if: '$CI_COMMIT_TAG =~ /^scholkit\/v\d+\.\d+\.\d+$/'
      when: never
  script:
    - go env -w GOPROXY=https://nexus.us.archive.org/repository/golang-org
    - go env -w 'GOSUMDB=sum.golang.org https://nexus.us.archive.org/repository/raw-sum-golang-proxy'
    - cd scholkit
    - make test

build:scholkit-deb:
  extends: .go-cache
  stage: build
  image: golang:${GO_VERSION}
  variables:
    DEBIAN_FRONTEND: noninteractive
    NFPM_VERSION: "2.44.1"
    http_proxy: "http://http-proxy.us.archive.org:8080"
    https_proxy: "http://http-proxy.us.archive.org:8080"
    no_proxy: "nexus.us.archive.org,*.archive.org,archive.org"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^scholkit\/v\d+\.\d+\.\d+$/'
      when: on_success
  script:
    - go env -w GOPROXY=https://nexus.us.archive.org/repository/golang-org
    - go env -w 'GOSUMDB=sum.golang.org https://nexus.us.archive.org/repository/raw-sum-golang-proxy'
    - go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v${NFPM_VERSION}
    - export PATH=$PATH:$(go env GOPATH)/bin
    - nfpm --version
    # Extract version from tag (scholkit-1.2.3 -> 1.2.3)
    - cd scholkit
    - make deb
  artifacts:
    paths:
      - scholkit/*.deb
    expire_in: 1 day

# TODO: remove obsolete https://nexus.us.archive.org/#browse/browse:raw-internal:scholkit
upload:scholkit:
  stage: upload
  image: curlimages/curl:8.18.0
  variables:
    NEXUS_URL: http://nexus.us.archive.org
  rules:
    - if: '$CI_COMMIT_TAG =~ /^scholkit\/v\d+\.\d+\.\d+$/'
      when: on_success
  script:
    - cd scholkit
    - export DEB_FILE=$(ls *.deb)
    - echo "uploading $DEB_FILE to $NEXUS_URL..."
    - |
      curl --noproxy '*' -v --user "$NEXUS_ADS_GLCI_PUBLISHER_USERNAME:$NEXUS_ADS_GLCI_PUBLISHER_PASSWORD" \
        --upload-file "${DEB_FILE}" \
        "${NEXUS_URL}/repository/raw-internal/scholar/${DEB_FILE}"
  needs:
    - build:scholkit-deb

# = djscholar ======================

# based on https://git.archive.org/archive-it/ait/-/blob/main/.gitlab-ci.yml?ref_type=heads
test:djscholar:
  stage: test
  image:
    name: python:3.13-bookworm
  services:
    - name: postgres:17-bookworm
      alias: fatcat-postgres-17
  variables:
    DJANGO_POSTGRESQL_HOST: fatcat-postgres-17
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_USER: fatcat
    POSTGRES_PASSWORD: fatcat
    ENV: CI
  script:
    - cd djscholar
    - pip install uv
    - uv sync --no-dev --no-python-downloads
    - DJANGO_SETTINGS_MODULE=djscholar.site.settings.ci uv run pytest
  rules:
    # skip on Go-project release tags (e.g. trawler/v1.2.3, blobproc/v0.4.0)
    - if: '$CI_COMMIT_TAG =~ /^(trawler|blobproc|scholkit)\/v\d+\.\d+\.\d+$/'
      when: never
    # run tests when any file in djscholar/ changes
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - djscholar/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
