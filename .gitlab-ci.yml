default:
  tags:
    - scholar

stages:
  - test
  - build
  - upload
variables:
  GO_VERSION: 1.26.0-trixie

.go-cache:
  variables:
    GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"
    GOCACHE: "$CI_PROJECT_DIR/.go/build"
  cache:
    key: scholar-go-mods-v1
    paths:
      - .go/pkg/mod/
      - .go/build/
    policy: pull-push

build:trawler-build:
  extends: .go-cache
  stage: build
  image: golang:${GO_VERSION}
  rules:
    - if: $CI_COMMIT_TAG =~ /^trawler\/v\d+\.\d+\.\d+$/
  script:
    - cd trawler
    - go env -w GOPROXY=https://nexus.us.archive.org/repository/golang-org
    - go env -w 'GOSUMDB=sum.golang.org https://nexus.us.archive.org/repository/raw-sum-golang-proxy'
    - make test
    - make trawler
  artifacts:
    paths:
      - "trawler/"
    expire_in: 1 week

test:trawler-mr-test:
  extends: .go-cache
  stage: test
  image: golang:${GO_VERSION}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - cd trawler
    - go env -w GOPROXY=https://nexus.us.archive.org/repository/golang-org
    - go env -w 'GOSUMDB=sum.golang.org https://nexus.us.archive.org/repository/raw-sum-golang-proxy'
    - make test

upload:trawler-upload:
  stage: upload
  image: curlimages/curl:8.18.0
  variables:
    NEXUS_URL: https://nexus.us.archive.org
  rules:
    - if: $CI_COMMIT_TAG =~ /^trawler\/v\d+\.\d+\.\d+$/
  dependencies:
    - build:trawler-build
  script:
    - cd trawler
    - make trawlerdebug
    - stat trawlerdebug
    - export VERSION=$(./trawlerdebug && ./trawlerdebug -v | sed 's/trawler version //')
    - echo "Uploading trawler binary to nexus..."
    - |
      curl -fv --user "$NEXUS_ADS_GLCI_PUBLISHER_USERNAME:$NEXUS_ADS_GLCI_PUBLISHER_PASSWORD" \
        --upload-file trawlerdebug "${NEXUS_URL}/repository/raw-internal/scholar/trawler-${VERSION}"

build-grobid:
  image: gradle:jre11-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never
  variables:
    BUILD_DIR: ia_grobid_build
    GROBID_VERSION: 0.8.2
    GROBID_REPO: https://github.com/kermitt2/grobid.git
    NEXUS_URL: http://nexus.us.archive.org
    NEXUS_BASICAUTH: "$NEXUS_USER:$NEXUS_PASSWORD"
  script:
    - mkdir $BUILD_DIR
    - git clone --branch $GROBID_VERSION --single-branch $GROBID_REPO
    - cd grobid
    - chmod +x gradlew
    - ./gradlew assemble
    - mv grobid-service/build/distributions/*.zip ../$BUILD_DIR
    - mv grobid-home/build/distributions/*.zip ../$BUILD_DIR
    - cd ..
    - rm -fr grobid
    - curl --user $NEXUS_BASICAUTH --upload-file $BUILD_DIR/grobid-home-$GROBID-VERSION.zip $NEXUS_URL/repository/raw-internal/grobid/grobid-home-$GROBID-VERSION.zip
    - curl --user $NEXUS_BASICAUTH --upload-file $BUILD_DIR/grobid-service-$GROBID-VERSION.zip $NEXUS_URL/repository/raw-internal/grobid/grobid-service-$GROBID-VERSION.zip

# ======== blobproc ========

test:blobproc:
  extends: .go-cache
  stage: test
  image: golang:${GO_VERSION}
  variables:
    DEBIAN_FRONTEND: noninteractive
    http_proxy: "http://http-proxy.us.archive.org:8080"
    https_proxy: "http://http-proxy.us.archive.org:8080"
    no_proxy: "nexus.us.archive.org,*.archive.org,archive.org"
  rules:
    # run tests when any file in blobproc/ changes (except VERSION file alone)
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - blobproc/**/*
      when: on_success
    # skip if this is a tag build (build job will run instead)
    - if: '$CI_COMMIT_TAG =~ /^blobproc\/v\d+\.\d+\.\d+$/'
      when: never
  script:
    - apt-get update && apt-get install -y sqlite3
    - go env -w GOPROXY=https://nexus.us.archive.org/repository/golang-org
    - go env -w 'GOSUMDB=sum.golang.org https://nexus.us.archive.org/repository/raw-sum-golang-proxy'
    - cd blobproc
    - make test

build:blobproc-deb:
  extends: .go-cache
  stage: build
  image: golang:${GO_VERSION}
  variables:
    DEBIAN_FRONTEND: noninteractive
    NFPM_VERSION: "2.44.1"
    http_proxy: "http://http-proxy.us.archive.org:8080"
    https_proxy: "http://http-proxy.us.archive.org:8080"
    no_proxy: "nexus.us.archive.org,*.archive.org,archive.org"
  rules:
    # Trigger only on version tags like blobproc-3.2.1
    - if: '$CI_COMMIT_TAG =~ /^blobproc\/v\d+\.\d+\.\d+$/'
      when: on_success
  script:
    - apt-get update && apt-get install -y pandoc
    - go env -w GOPROXY=https://nexus.us.archive.org/repository/golang-org
    - go env -w 'GOSUMDB=sum.golang.org https://nexus.us.archive.org/repository/raw-sum-golang-proxy'
    - go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v${NFPM_VERSION}
    - export PATH=$PATH:$(go env GOPATH)/bin
    - nfpm --version
    - echo "building blobproc"
    - cd blobproc
    - make deb
  artifacts:
    paths:
      - blobproc/*.deb
    expire_in: 1 day

# TODO: remove obsolete https://nexus.us.archive.org/#browse/browse:raw-internal:blobproc
upload:blobproc:
  stage: upload
  image: curlimages/curl:8.18.0
  variables:
    NEXUS_URL: http://nexus.us.archive.org
  rules:
    - if: '$CI_COMMIT_TAG =~ /^blobproc\/v\d+\.\d+\.\d+$/'
      when: on_success
  script:
    - cd blobproc
    - export VERSION=$(./blobproc version)
    - export DEB_FILE=$(ls *.deb)
    - echo "uploading $DEB_FILE to $NEXUS_URL..."
    - |
      curl --noproxy '*' -v --user "$NEXUS_ADS_GLCI_PUBLISHER_USERNAME:$NEXUS_ADS_GLCI_PUBLISHER_PASSWORD" \
        --upload-file "${DEB_FILE}" \
        "${NEXUS_URL}/repository/raw-internal/scholar/${DEB_FILE}"
  needs:
    - build:blobproc-deb

