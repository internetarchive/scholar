<!DOCTYPE html>
<html lang="en" style="position: relative; min-height: 100%; height: auto;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="origin-when-cross-origin">

  <title>{%- block title -%}
    Perpetual Access To The Scholarly Record
  {%- endblock %} | fatcat!</title>

  <link rel="stylesheet"
    type="text/css"
    href="{{ static('fcweb/semantic.min.css') }}">
  <link rel="preload"
    href="{{ static('fcweb/fc_font.css') }}"
    as="style">
  <link rel="preload"
    href="{{ static('fcweb/icons.woff2') }}"
    as="font"
    type="font/woff2">
  <link rel="icon" href="data:,">

  <style>
    .ui.inverted.menu .item:before { background: none; }

    @media only screen and (max-width: 479px) {
      .mobile-hide{ display: none !important; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body style="margin-bottom: 130px;">

<header class="ui fixed inverted menu" style="height: 3em;">
  <div class="ui container">
    <a href="{{ url('fcweb:index') }}" class="header item">Fatcat</a>
    <a href="{{ url('fcweb:page_about') }}" class="item mobile-hide">About</a>
    <a href="{{ url('fcweb:page_guide') }}" class="item mobile-hide">Guide</a>
    <a href="{{ url('fcweb:changelog_view') }}" class="item mobile-hide">Changelog</a>
    <a href="{{ url('ftsearch:home') }}" class="item mobile-hide">IA Scholar</a>
    <div class="right menu">
      <div class="item" style="padding: 0;">
        <form action="{{ url('fcweb:search') }}" method="get" role="search" aria-label="Papers">
          <div class="ui transparent inverted icon input">
            <i class="search icon" style="padding-right: 2em;"></i>
            <input type="text" placeholder="Search Papers..." name="q" style="border: 1px solid #777 !important; padding: 5px !important; width: 15em;">
          </div>
        </form>
      </div>
    </div>
  </div>
</header>

{% block fullmain %}
<main class="ui main container" style="margin-top: 6em; margin-bottom: 2em;" {% block main_extra_attr %}{% endblock %}>
{% block fullbody %}
  <div class="ui container text">
    {% block body %}Nothing to see here.{% endblock %}
  </div>
{% endblock %}
</main>
{% endblock %}

<footer class="ui inverted vertical footer segment" style="margin-top: 2em; padding-top: 2em; padding-bottom:2em; position: absolute; bottom: 0px; width: 100%;">
  <div class="ui center aligned container">
    <div class="ui horizontal inverted small divided link list">
      <a class="item" href="{{ url('fcweb:index') }}">fatcat!</a>
      <a class="item" href="{{ url('fcweb:page_about') }}">About</a>
      <a class="item" href="https://github.com/internetarchive/scholar/">Code</a>
    </div>
  </div>
</footer>

<script
  src="https://cdn.jsdelivr.net/npm/jquery@3.3.1/dist/jquery.min.js"
  integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
  crossorigin="anonymous">
</script>
<script
  src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.8.6/dist/semantic.min.js"
  integrity="sha256-9H3HWYnPJ2bEHgkOrw+48KheOqYzTvJd1hbeU9sEDFk="
  crossorigin="anonymous">
</script>
{% block postscript %}{% endblock %}

</body>
</html>
