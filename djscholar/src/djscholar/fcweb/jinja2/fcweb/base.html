<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="origin-when-cross-origin">

  <title>{%- block title -%}
    Home
  {%- endblock %} | Fatcat Bibliographic Database</title>

  <link rel="icon" href="data:,">

  <style>
    @font-face {
      font-family: "Jacquard";
      src: url("{{ static('fcweb/Jacquard12-Regular.ttf') }}") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    /* -- Reset & base -------------------------------------------------------- */

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: #2980b9; text-decoration: none; }
    a:hover { color: #1a5276; }

    h3 {
      margin-top: 1rem;
      margin-bottom: 1rem;
    }

    /* -- Layout containers --------------------------------------------------- */

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1rem;
      width: 100%;
    }

    .container-wide {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 1rem;
      width: 100%;
    }

    .container-text {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1rem;
      width: 100%;
    }

    /* -- Top navigation bar -------------------------------------------------- */

    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 3rem;
      background: #1b1c1d;
      display: flex;
      align-items: center;
      padding: 0 1rem;
    }

    .top-nav-inner {
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .top-nav a {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      font-size: 0.875rem;
      white-space: nowrap;
    }

    .top-nav a:hover {
      color: #fff;
    }

    .top-nav .nav-brand {
      font-weight: bold;
      font-size: 1rem;
    }

    .top-nav .nav-search {
      margin-left: auto;
    }

    .top-nav .nav-search input {
      background: transparent;
      border: 1px solid #777;
      color: #fff;
      padding: 0.3rem 0.5rem;
      font-size: 0.875rem;
      width: 15em;
      border-radius: 3px;
    }

    .top-nav .nav-search input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    @media (max-width: 640px) {
      .mobile-hide { display: none !important; }

      .top-nav .nav-search input { width: 10em; }
    }

    /* -- Entity header (grey banner with title + tabs) ----------------------- */

    .entity-header {
      background: #eee;
      padding: 2rem 0 0;
    }

    .entity-header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 0.25rem;
    }

    .entity-header .subtitle {
      font-size: 1.1rem;
      font-weight: normal;
      color: #555;
    }

    .entity-header .entity-ident {
      font-size: 0.8rem;
      color: #777;
      margin-top: 0.25rem;
    }

    .entity-header .entity-byline {
      font-size: 1.05rem;
      margin-top: 0.5rem;
    }

    /* -- Tab navigation ------------------------------------------------------ */

    .tab-nav {
      display: flex;
      gap: 0;
      margin-top: 1rem;
    }

    .tab-nav a {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      color: #555;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      white-space: nowrap;
    }

    .tab-nav a:hover {
      color: #333;
      border-bottom-color: #999;
    }

    .tab-nav a.active {
      color: #333;
      font-weight: 600;
      background-color: white;
    }

    /* -- Two-column entity layout -------------------------------------------- */

    .entity-grid {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 768px) {
      .entity-grid {
        grid-template-columns: 1fr;
      }
    }

    /* -- Segments (info boxes) ----------------------------------------------- */

    .segment {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 1rem;
      margin-bottom: 1rem;

      background: #fff;
    }

    .segment-attached {
      border-radius: 0;
      margin-bottom: 0;
      border-top: 0;
    }

    .segment-attached:first-child {
      border-radius: 4px 4px 0 0;
    }

    .segment-attached:last-child {
      border-radius: 0 0 4px 4px;
    }

    .segment-muted {
      background: #f8f8f8;
    }

    .segment b {
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
    }

    /* -- Tables -------------------------------------------------------------- */

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    th, td {
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #eee;
    }

    th {
      font-weight: 600;
      color: #555;
      background: #fafafa;
    }

    /* -- Messages / alerts --------------------------------------------------- */

    .msg {
      padding: 1rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .msg-error {
      background: #fdf0f0;
      border: 1px solid #e8c4c4;
      color: #8b2020;
    }

    .msg-warning {
      background: #fef9e7;
      border: 1px solid #e8d8a0;
      color: #7d6608;
    }

    .msg-info {
      background: #eef6fc;
      border: 1px solid #b8d4e8;
      color: #1a5276;
    }

    /* -- Buttons ------------------------------------------------------------- */

    .btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      line-height: 1.4;
    }

    .btn-primary {
      background: #333;
      color: #fff;
    }

    .btn-primary:hover {
      background: #555;
      color: #fff;
    }

    /* -- Labels (small inline badges) ---------------------------------------- */

    .label {
      display: inline-block;
      padding: 0.15em 0.5em;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 3px;
      vertical-align: middle;
    }

    .label-green { background: #d4edda; color: #155724; }
    .label-red { background: #f8d7da; color: #721c24; }
    .label-orange { background: #fff3cd; color: #856404; }
    .label-grey { background: #e9ecef; color: #555; }

    /* -- Preservation status bar ---------------------------------------------- */

    .preservation-bar {
      display: flex;
      height: 1.5rem;
      border-radius: 3px;
      overflow: hidden;
      font-size: 0.7rem;
      line-height: 1.5rem;
      text-align: center;
      color: #fff;
    }

    .preservation-bar > span {
      display: inline-block;
    }

    /* -- Search form --------------------------------------------------------- */

    .search-form {
      display: flex;
      gap: 0.5rem;
    }

    .search-form input[type="text"] {
      flex: 1;
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      border: 2px solid #ccc;
      border-radius: 4px;
    }

    .search-form input[type="text"]:focus {
      outline: none;
      border-color: #333;
    }

    .search-form button {
      padding: 0.5rem 1.25rem;
      font-size: 1rem;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .search-form button:hover {
      background: #555;
    }

    /* -- Accordion (details/summary) ----------------------------------------- */

    details.accordion summary {
      padding: 0.75rem 1rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      list-style: none;
    }

    details.accordion summary::-webkit-details-marker { display: none; }
    details.accordion summary::before {
      content: "\25b6\00a0";
      font-size: 0.7em;
    }
    details.accordion[open] summary::before {
      content: "\25bc\00a0";
    }

    details.accordion > :not(summary) {
      padding: 0.75rem 1rem;
    }

    /* -- Main content area --------------------------------------------------- */

    main {
      flex: 1;
      padding: 2rem 0;
    }

    /* -- Footer -------------------------------------------------------------- */

    footer {
      background: #1b1c1d;
      color: rgba(255, 255, 255, 0.7);
      padding: 2rem;
      font-size: 0.8rem;
      text-align: center;
    }

    footer a {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
    }

    footer a:hover {
      color: #fff;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 0.5rem 1.5rem;
      flex-wrap: wrap;
      list-style: none;
    }

    .footer-links li::after {
      content: "\00b7";
      margin-left: 1.5rem;
      color: rgba(255, 255, 255, 0.3);
    }

    .footer-links li:last-child::after {
      content: none;
    }

    {% block styles %}{% endblock %}
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="top-nav">
  <div class="top-nav-inner">
    <a href="{{ url('fcweb:index') }}" class="nav-brand">Fatcat Bibliographic Database</a>
    <a href="{{ url('fcweb:page_about') }}" class="mobile-hide">About</a>
    <a href="{{ url('fcweb:page_guide') }}" class="mobile-hide">Guide</a>
    <a href="{{ url('fcweb:changelog_view') }}" class="mobile-hide">Changelog</a>
    <a href="{{ url('ftsearch:home') }}" class="mobile-hide">IA Scholar</a>
    <form class="nav-search" action="{{ url('fcweb:search') }}" method="get" role="search" aria-label="Papers">
      <input type="text" name="q" placeholder="Search Papers...">
    </form>
  </div>
</nav>

{% block fullmain %}
<main {% block main_extra_attr %}{% endblock %}>
{% block fullbody %}
  <div class="container-text">
    {% block body %}{% endblock %}
  </div>
{% endblock %}
</main>
{% endblock %}

<footer>
  <ul class="footer-links">
    <li><a href="{{ url('fcweb:index') }}">Home</a></li>
    <li><a href="{{ url('fcweb:page_about') }}">About</a></li>
    <li><a href="https://github.com/internetarchive/scholar/">Code</a></li>
  </ul>
</footer>

{% block postscript %}{% endblock %}

</body>
</html>
