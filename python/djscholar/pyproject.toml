[project]
name = "djscholar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nate smith", email = "nsmith@archive.org" }
]
requires-python = ">=3.13"
dependencies = [
    "django==5.1.5",
    "django-ninja==1.4.0",
    "ninja-api-key==1.0.2",
    "psycopg[binary]==3.2.4",
    "surt==0.3.1",
]

[project.scripts]
djscholar = "djscholar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djscholar"]

[[tool.uv.index]]
url = "http://nexus.us.archive.org/repository/pypi-group/simple"
default = true

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "djscholar.site.settings"

#[tool.pylsp-mypy]
## Sadly, this would not acknowledge mypy_django_plugin
#enabled = true
#dmypy = true
#live_mode = false
#strict = false
#exclude = ["tests/*"]

[tool.django-stubs]
django_settings_module = "djscholar.site.settings"


[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]==5.1.2",
    "factory-boy==3.3.3",
    "mypy==1.14.1",
    "pytest-django==4.11.0",
    "ruff==0.11.2",
]
