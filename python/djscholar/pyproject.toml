[project]
name = "djscholar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nate smith", email = "nateksmith@pm.me" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=5.1.5",
    "django-ninja>=1.3.0",
]

[project.scripts]
djscholar = "djscholar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "http://nexus.us.archive.org/repository/pypi-group/simple"
default = true
