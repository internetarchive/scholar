[project]
name = "djscholar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nate smith", email = "nateksmith@pm.me" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=5.1.5",
    "django-ninja>=1.3.0",
    "psycopg[binary]>=3.2.4",
]

[project.scripts]
djscholar = "djscholar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djscholar"]

[[tool.uv.index]]
url = "http://nexus.us.archive.org/repository/pypi-group/simple"
default = true

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

#[tool.pylsp-mypy]
## Sadly, this would not acknowledge mypy_django_plugin
#enabled = true
#dmypy = true
#live_mode = false
#strict = false
#exclude = ["tests/*"]

[tool.django-stubs]
django_settings_module = "djscholar.site.settings"


[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.1.2",
    "mypy>=1.14.1",
    "ruff>=0.9.3",
]
